name: Build & Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller
      - name: Lint & test
        run: |
          ruff check .
          pytest -q
      - name: Package Windows executable
        shell: pwsh
        run: ./packaging/build_win.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: commander-win64
          path: dist/commander-win64.zip

  build-macos:
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
      INSTALL_APP: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller
      - name: Lint & test
        run: |
          ruff check .
          pytest -q
      - name: Import macOS release signing identity
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CERTIFICATE_BASE64" ] || [ -z "$CERTIFICATE_PASSWORD" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "::error::macOS release signing secrets are missing"
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/commander-signing.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/commander-certificate.p12"
          trap 'rm -f "$CERTIFICATE"' EXIT
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          SIGN_ID=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)
          if [ -z "$SIGN_ID" ]; then
            echo "::error::No valid Developer ID Application identity found"
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$SIGN_ID" >> "$GITHUB_ENV"
      - name: Package macOS app & DMG
        run: ./packaging/build_mac.sh
      - name: Verify macOS release signature
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          codesign --verify --deep --strict --verbose=2 dist/commander.app
          codesign -dv --verbose=4 dist/commander.app 2>&1 | grep 'Authority=Developer ID Application:'
      - uses: actions/upload-artifact@v4
        with:
          name: commander-macos
          path: |
            dist/commander.dmg
            dist/commander.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/commander-win64.zip
            artifacts/commander.dmg
            artifacts/commander.zip
