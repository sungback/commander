name: Build & Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller
      - name: Lint & test
        run: |
          ruff check .
          pytest -q
      - name: Package Windows executable
        shell: pwsh
        run: ./packaging/build_win.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: commander-win64
          path: dist/commander-win64.zip

  build-macos:
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
      INSTALL_APP: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller
      - name: Lint & test
        run: |
          ruff check .
          pytest -q
      - name: Package macOS app & DMG
        run: ./packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: commander-macos
          path: |
            dist/commander.dmg
            dist/commander.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/commander-win64.zip
            artifacts/commander.dmg
            artifacts/commander.zip
